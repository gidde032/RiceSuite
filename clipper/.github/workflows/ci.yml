name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      # Lint and format are folded into this one job so the ruleset pins a
      # single required check. ffmpeg is NOT installed: the suite mocks every
      # ffmpeg/whisper invocation (see tests/), so CI needs no system media
      # toolchain.
      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run tests and enforce coverage floor
        run: >-
          python -m pytest tests/ -q -ra
          --cov=app --cov=render --cov=transcribe
          --cov-fail-under=85
