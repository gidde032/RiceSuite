<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiceClipper</title>
  <link rel="icon" href="slate-logo.png" type="image/png" />
  <link rel="stylesheet" href="slate.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="app-identity">
      <img src="slate-logo.png" alt="" width="32" height="32" />
      <span class="sr-only">RiceClipper</span>
    </h1>
    <span id="capbadge" class="badge" title="ffmpeg libass status" aria-live="polite"></span>
  </header>

  <main>
    <section id="operation-progress" class="operation-progress" role="status" aria-live="polite" aria-atomic="true">
      <div class="operation-progress-row">
        <strong id="progress-operation">Clip progress</strong>
        <span id="progress-state">○ Idle</span>
        <span id="progress-count"></span>
      </div>
      <div id="progress-current">Choose clips or pull a batch to begin.</div>
    </section>
    <!-- Step 1: upload (one or more clips) -->
    <section id="upload-panel" class="panel">
      <label class="dropzone" for="file-input">
        <span class="upload-icon" aria-hidden="true">↥</span>
        <strong>Choose clips</strong>
        <span>Pick one or several videos or photos. Under ~1 minute each. Landscape clips use subject crop or blur-pad. Photos (PNG, JPEG, WebP) become clips of a set length.</span>
        <input id="file-input" class="file-input-accessible" type="file" accept="video/*,image/png,image/jpeg,image/webp" multiple />
      </label>

      <div class="upload-tools">
        <div class="searcher-pull">
          <button id="pull-searcher-btn" type="button">Pull from RiceSearcher</button>
          <span class="hint">Ingest the next batch of selected clips from <code>~/ricesearcher-handoff</code>.</span>
          <p id="pull-status" class="status hidden" role="status"></p>
        </div>
        <div class="cache-tools">
          <div class="cache-actions">
            <span id="cache-info" class="hint">Media cache: loading…</span>
            <button id="clear-cache-btn" type="button">Clear media cache</button>
          </div>
          <p id="cache-status" class="status" role="status"></p>
        </div>
      </div>

      <p id="upload-status" class="status" role="status"></p>
    </section>

    <!-- Step 2: batch review + render -->
    <section id="batch-panel" class="panel hidden">
      <div id="clips"></div>
      <div class="batch-actions">
        <button id="restart-btn" type="button">Start over</button>
        <button id="send-handoff-btn" type="button" disabled>Send to RicePoster</button>
        <button id="render-all-btn" class="primary">Render all</button>
      </div>
      <!-- Names the Searcher batch waiting behind this unsent one (RiceSuite #61). -->
      <p id="searcher-waiting" class="status" role="status" hidden></p>
      <p id="batch-status" class="status hidden" role="status"></p>
    </section>
  </main>

  <!-- One review card per clip, cloned per upload. -->
  <template id="clip-card-template">
    <article class="clip-card">
      <div class="clip-head">
        <span class="clip-title"></span>
        <span class="clip-status status" role="status"></span>
        <button class="clip-remove" type="button" title="Remove this clip">✕</button>
      </div>

      <div class="review-grid">
        <div class="preview-col">
          <video class="source-video" controls playsinline muted></video>
          <img class="source-photo" alt="" />
          <!-- Header preview (RiceSuite #65): the server's exact header PNG,
               scaled over the source's 9:16 frame. -->
          <div class="header-preview-window" hidden><canvas class="header-preview-base" hidden></canvas><img class="header-preview" alt="" /></div>
          <p class="geo-note hint"></p>
          <p class="preview-status status" role="status"></p>
        </div>

        <div class="edit-col">
          <div class="field field-row">
            <label class="header-label">Header</label>
            <div>
              <textarea class="header-input" rows="2" maxlength="200" placeholder="Your on-screen hook…" aria-describedby="header-help"></textarea>
              <div class="header-gen">
                <button class="header-generate" type="button" title="Generate a header from the frame + transcript">✨ Generate</button>
                <input class="header-feedback" type="text" placeholder="Optional guidance for regenerate…" aria-label="Header regeneration guidance" />
              </div>
              <p class="header-gen-status status" role="status"></p>
              <p id="header-help" class="hint">1–2 lines, up to 200 characters, burned into the frame. Auto-filled after transcription; edit freely.</p>
            </div>
          </div>

          <fieldset class="field choice-field content">
            <legend>Content</legend>
            <div class="choice-grid content-choice-grid">
              <label class="choice-card">
                <input type="radio" name="content" value="speech" checked />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="choice-label">Speech</span>
              </label>
              <label class="choice-card">
                <input type="radio" name="content" value="music" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="choice-label">Music</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="field choice-field geometry" hidden>
            <legend>Geometry</legend>
            <div class="choice-grid geometry-choice-grid">
              <label class="choice-card">
                <input type="radio" name="geometry" value="auto" checked />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="geometry-summary"></span>
                <span class="geometry-warning" hidden></span>
                <span class="choice-label">Auto</span>
              </label>
              <label class="choice-card">
                <input type="radio" name="geometry" value="blur_pad" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="choice-label">Blur-pad</span>
              </label>
              <label class="choice-card">
                <input type="radio" name="geometry" value="crop" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="choice-label">Crop</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="field choice-field header-style">
            <legend>Header style</legend>
            <div class="header-style-body">
            <div class="choice-grid header-choice-grid">
              <label class="choice-card">
                <input type="radio" name="header-style" value="plain" checked />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="header-sample sample-plain">Build systems,<br />not hustle</span>
                <span class="choice-label">Plain text</span>
              </label>
              <label class="choice-card">
                <input type="radio" name="header-style" value="black_plate" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="header-sample sample-black">Build systems,<br />not hustle</span>
                <span class="choice-label">Black plate</span>
              </label>
              <label class="choice-card">
                <input type="radio" name="header-style" value="white_plate" />
                <span class="choice-check" aria-hidden="true">✓</span>
                <span class="header-sample sample-white">Build systems,<br />not hustle</span>
                <span class="choice-label">White plate</span>
              </label>
            </div>
            <!-- Header controls (RiceSuite #65, variant A). A style card fills
                 in the look; position, size, font, alignment and spacing stay. -->
            <details class="header-adjust">
              <summary>Adjust header</summary>
              <div class="hc-grid">
                <label class="vol hc hc-wide"><span>Position</span><input class="hc-y" type="range" min="0" max="1380" step="2" value="210" /><output class="vol-label hc-y-out">210 px</output></label>
                <label class="vol hc"><span>Size</span><input class="hc-size" type="range" min="24" max="96" step="1" value="42" /><output class="vol-label hc-size-out">42 px</output></label>
                <label class="vol hc hc-select"><span>Font</span><select class="hc-font">
                  <option value="arial">Arial Bold</option>
                  <option value="helvetica">Helvetica Neue Bold</option>
                  <option value="avenir">Avenir Next Heavy</option>
                  <option value="futura">Futura Bold</option>
                  <option value="impact">Impact</option>
                  <option value="arial_black">Arial Black</option>
                  <option value="din">DIN Condensed Bold</option>
                  <option value="georgia">Georgia Bold</option>
                </select></label>
                <div class="vol hc hc-colors"><span>Text</span><input class="hc-color" type="color" value="#ffffff" aria-label="Text colour" /><span>Edge</span><input class="hc-outline-color" type="color" value="#000000" aria-label="Outline colour" /></div>
                <label class="vol hc"><span>Outline</span><input class="hc-outline" type="range" min="0" max="8" step="1" value="2" /><output class="vol-label hc-outline-out">2 px</output></label>
                <label class="switch-label hc"><input class="hc-shadow" type="checkbox" /><span>Soft shadow</span></label>
                <label class="vol hc hc-select"><span>Plate</span><select class="hc-plate">
                  <option value="none">None</option>
                  <option value="solid">Solid</option>
                  <option value="translucent">Translucent</option>
                </select></label>
                <div class="vol hc hc-colors hc-plate-only"><span>Fill</span><input class="hc-plate-color" type="color" value="#000000" aria-label="Plate colour" /></div>
                <label class="vol hc hc-plate-only hc-opacity-only"><span>Opacity</span><input class="hc-opacity" type="range" min="10" max="100" step="5" value="75" /><output class="vol-label hc-opacity-out">75%</output></label>
                <label class="vol hc hc-plate-only"><span>Corners</span><input class="hc-radius" type="range" min="0" max="40" step="1" value="0" /><output class="vol-label hc-radius-out">0 px</output></label>
                <label class="vol hc hc-plate-only"><span>Padding</span><input class="hc-padding" type="range" min="0" max="40" step="1" value="16" /><output class="vol-label hc-padding-out">16 px</output></label>
                <label class="vol hc hc-select"><span>Align</span><select class="hc-align">
                  <option value="left">Left</option>
                  <option value="center">Centre</option>
                  <option value="right">Right</option>
                </select></label>
                <label class="vol hc"><span>Spacing</span><input class="hc-spacing" type="range" min="0.8" max="2" step="0.05" value="1" /><output class="vol-label hc-spacing-out">1.00×</output></label>
                <div class="hc hc-wide hc-foot"><button class="hc-reset" type="button">Reset header</button><span class="hint">Saved for this clip's slot, like the header style.</span></div>
              </div>
            </details>
            <p class="header-preview-note hint" role="status"></p>
            </div>
          </fieldset>

          <div class="field field-row photo-length">
            <label class="photo-length-label">Length</label>
            <div class="photo-length-stack">
              <input class="photo-length-input" type="number" min="3" max="60" step="1" value="10" inputmode="numeric" aria-describedby="photo-length-help" />
              <span id="photo-length-help" class="hint">Seconds, 3–60. The photo holds for this long.</span>
            </div>
          </div>

          <div class="field field-row captions-row">
            <span class="field-label">Burn captions</span>
            <label class="switch-label">
              <input class="captions-toggle" type="checkbox" checked />
              <span>Burn captions into video</span>
            </label>
          </div>

          <fieldset class="field choice-field caption-style">
            <legend>Caption style</legend>
            <div class="choice-grid caption-choice-grid">
              <label class="choice-card"><input type="radio" name="caption-style" value="classic" checked /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-classic">Aa</span><span class="choice-label">Classic</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="clean" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-clean">Aa</span><span class="choice-label">Clean</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="punch" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-punch">Aa</span><span class="choice-label">Punch</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="friendly" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-friendly">Aa</span><span class="choice-label">Friendly</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="sunset" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-sunset">Aa</span><span class="choice-label">Sunset</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="mono" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-mono">Aa</span><span class="choice-label">Mono</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="editorial" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-editorial">Aa</span><span class="choice-label">Editorial</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="lyric_block" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-lyric-block">Aa</span><span class="choice-label">Lyric Block</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="velvet_serif" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-velvet-serif">Aa</span><span class="choice-label">Velvet Serif</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="din_condensed" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-din-condensed">Aa</span><span class="choice-label">Powder</span></label>
              <label class="choice-card"><input type="radio" name="caption-style" value="baskerville" /><span class="choice-check" aria-hidden="true">✓</span><span class="caption-sample sample-baskerville">Aa</span><span class="choice-label">Baskerville</span></label>
            </div>
          </fieldset>

          <div class="field field-row music-field">
            <label>Music <span class="hint">optional</span></label>
            <div class="music-stack">
              <input class="music-input" type="file" accept="audio/*" aria-label="Choose optional music" />
              <div class="music-controls">
                <select class="music-mode" aria-label="Music mode">
                <option value="none">No added music</option>
                <option value="mix">Mix under original</option>
                <option value="replace">Replace original</option>
                </select>
                <label class="vol"><span>Volume</span>
                  <input class="music-volume" type="range" min="0" max="1.5" step="0.05" value="0.35" />
                  <output class="vol-label">0.35</output>
                </label>
              </div>
              <div class="music-segment">
                <label class="vol music-start-field"><span>Start at</span>
                  <input class="music-start" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="Music start point" />
                  <output class="vol-label music-start-label">0:00</output>
                </label>
                <button class="music-play" type="button" disabled>▶ Play segment</button>
                <audio class="music-preview" preload="metadata"></audio>
              </div>
              <p class="music-segment-hint hint">Choose a track to pick where it starts.</p>
            </div>
          </div>
        </div>

        <!-- Rendered clip (RiceSuite #20): a 9:16 frame beside the controls,
             empty until a render lands. -->
        <div class="clip-result is-empty">
          <div class="result-frame">
            <video class="output-video" controls playsinline preload="metadata"></video>
            <div class="result-empty">
              <span class="result-guide guide-header">Header</span>
              <span class="result-guide guide-caption">Captions</span>
              <strong>Rendered clip appears here</strong>
              <span>9:16 · 1080×1920</span>
            </div>
            <div class="result-stale"><span>Edited since this render</span></div>
            <div class="result-busy" aria-hidden="true"><span>Rendering…</span></div>
          </div>
          <a class="download-link primary" download>Download mp4</a>
        </div>

        <div class="text-row">
          <div class="text-panel transcript-panel">
            <div class="text-heading">
              <span class="field-label">Generated transcript</span>
              <span class="hint">Edit any misheard word. Timing stays locked.</span>
            </div>
            <div class="transcript" contenteditable="false" aria-label="Editable transcript"></div>
          </div>

          <div class="text-panel lyrics" hidden>
            <div class="text-heading">
              <label class="field-label" for="lyrics-input">Paste lyrics</label>
              <span class="hint">Optional</span>
            </div>
            <textarea id="lyrics-input" class="lyrics-input" rows="4" placeholder="Paste lyrics, one line per caption line"></textarea>
            <div class="lyrics-actions">
              <button class="lyrics-align" type="button">Align</button>
              <button class="lyrics-restore" type="button">Restore transcript</button>
              <span class="lyrics-badge" aria-live="polite"></span>
            </div>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
