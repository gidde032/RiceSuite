<div id="rice-searcher-layouts">
  <div class="viz-carousel" aria-label="Searcher source workspace layouts">
    <section data-variant="Split workspace" aria-label="Split source workspace"><div class="rs-mount" data-layout="split"></div></section>
    <section data-variant="Source detail" aria-label="Dedicated source detail" hidden><div class="rs-mount" data-layout="detail"></div></section>
    <section data-variant="Inspector drawer" aria-label="Source inspector drawer" hidden><div class="rs-mount" data-layout="drawer"></div></section>
  </div>
  <template id="rs-workspace-template">
    <div class="rs-app" aria-label="RiceSearcher proposed workspace">
      <header class="rs-suite"><span class="rs-wordmark">RiceSuite</span><nav aria-label="Suite"><button type="button" aria-current="page">Search</button><button type="button" disabled>Clip</button><button type="button" disabled>Post</button></nav><span class="rs-local">Local workspace</span></header>
      <header class="rs-topbar"><div class="rs-brand"><img data-mark alt="" width="26" height="26"><span>RiceSearcher</span></div><nav class="rs-navigation" aria-label="Searcher"><button type="button" data-page="sources" aria-current="page">Sources</button><button type="button" data-page="review">Review</button><button type="button" data-page="profiles">Profiles</button></nav><label class="rs-profile-label">Profile<select data-profile aria-label="Active profile"><option>Music moments</option><option>Interview moments</option></select></label></header>
      <section class="rs-run" aria-label="Processing batch">
        <div class="rs-run-line"><div><strong data-run-title>Batch finished with an error</strong><span class="rs-secondary" data-run-description>Music moments · 4 sources added · 3 scored · 1 scoring failure</span></div><div class="rs-actions"><button type="button" data-run-toggle aria-expanded="false">Details</button><button type="button" data-retry>Retry failed scoring</button><button type="button" data-stop hidden>Stop after current source</button></div></div>
        <div class="rs-run-meter" hidden><span></span></div>
        <div class="rs-run-details" hidden><ol><li><span>Single release · official video</span><span>Added and scored</span></li><li><span>Acoustic session</span><span>Added and scored</span></li><li><span>A conversation about the record</span><span>Added and scored</span></li><li><span>Album launch interview</span><span class="rs-error">Scoring failed · source retained</span></li><li><span>Backstage rehearsal</span><span data-run-last>Added · not scored</span></li></ol></div>
      </section>
      <main class="rs-content">
        <section data-screen="sources">
          <div class="rs-section-heading"><div><h2>Sources <span class="rs-secondary rs-source-count">5</span></h2><p>Shared library. Segments and scores belong to the chosen profile.</p></div><button class="rs-primary" type="button" data-add-toggle aria-expanded="false">Add sources</button></div>
          <section class="rs-intake" aria-label="Add sources" hidden>
            <div class="rs-section-heading"><h3>Add sources</h3><button type="button" data-close-intake>Close</button></div>
            <div class="rs-intake-grid"><label>URLs or local paths<span class="rs-secondary">One source per line</span><textarea rows="4" data-requests placeholder="Paste a video URL or /path/to/video.mp4"></textarea></label><label class="rs-drop">Choose local files<span class="rs-secondary">Or drop video and audio files here</span><input type="file" multiple accept="video/*,audio/*" data-files><span class="rs-secondary" data-file-count>No files chosen</span></label></div>
            <details class="rs-advanced"><summary>Advanced settings</summary><div class="rs-settings"><label>Transcription model<input data-whisper value="small"></label><label>Scoring mode<select data-scoring-mode><option>Anthropic scoring</option><option>Offline heuristics</option></select></label><label>Scoring model<input data-model placeholder="Configured default"></label><label>Duplicate similarity threshold<input type="number" min="0" max="1" step="0.01" value="0.65"></label></div></details>
            <div class="rs-intake-footer"><span class="rs-secondary">Score under <strong data-profile-name>Music moments</strong></span><div class="rs-actions"><button type="button" data-start="only">Add only</button><button type="button" class="rs-primary" data-start="score">Add &amp; score</button></div></div>
            <p class="rs-inline-message" data-intake-message role="status" aria-live="polite"></p>
          </section>
          <div class="rs-workspace">
            <section class="rs-library" aria-label="Source library">
              <div class="rs-bulk"><label><input type="checkbox" data-select-all> <span data-selection-count>2 selected</span></label><button type="button" data-score-selected>Score selected</button></div>
              <div class="rs-source-rows">
                <article class="rs-source-row rs-source-open" data-source="0"><input type="checkbox" checked aria-label="Include Single release in scoring batch"><button class="rs-source-open-button" type="button" data-open="0"><strong>Single release · official video</strong><span>Video · 03:42 · 142 MB</span><span class="rs-source-state">3 candidates · 1 manual segment</span></button></article>
                <article class="rs-source-row" data-source="1"><input type="checkbox" checked aria-label="Include Acoustic session in scoring batch"><button class="rs-source-open-button" type="button" data-open="1"><strong>Acoustic session</strong><span>Video · 04:16 · 86 MB</span><span class="rs-source-state">4 candidates</span></button></article>
                <article class="rs-source-row" data-source="2"><input type="checkbox" aria-label="Include A conversation about the record in scoring batch"><button class="rs-source-open-button" type="button" data-open="2"><strong>A conversation about the record</strong><span>Video · 24:08 · 680 MB</span><span class="rs-source-state">8 candidates</span></button></article>
                <article class="rs-source-row" data-source="3"><input type="checkbox" aria-label="Include Album launch interview in scoring batch"><button class="rs-source-open-button" type="button" data-open="3"><strong>Album launch interview</strong><span>Video · 18:36 · 420 MB</span><span class="rs-error">Scoring failed · source available</span></button></article>
                <article class="rs-source-row" data-source="4"><input type="checkbox" aria-label="Include Backstage rehearsal in scoring batch"><button class="rs-source-open-button" type="button" data-open="4"><strong>Backstage rehearsal</strong><span>Video · 02:39 · 74 MB</span><span class="rs-source-state">Not scored</span></button></article>
              </div>
              <div class="rs-empty-library" hidden><h3>No sources yet</h3><p>Add a URL or a local file to begin.</p><button type="button" data-add-empty>Add sources</button></div>
              <details class="rs-storage"><summary>Manage storage</summary><p>Deleting media also removes its transcript and library segments.</p><div class="rs-actions"><button type="button" class="rs-danger" data-delete-source>Delete open source…</button><button type="button" class="rs-danger" data-clear-cache>Clear entire cache…</button></div></details>
            </section>
            <section class="rs-inspector" aria-label="Open source">
              <div class="rs-inspector-navigation"><button type="button" data-back>Back to sources</button><button type="button" data-close-inspector>Close source</button></div>
              <div class="rs-inspector-heading"><div><h3 data-source-title>Single release · official video</h3><p class="rs-secondary">Artist channel · <span data-source-duration>03:42</span> · Cached locally</p></div><button type="button" data-source-review>View segments</button></div>
              <div class="rs-inspection-grid">
                <div class="rs-player-area"><video controls playsinline preload="metadata" aria-label="Full source video, synthetic sample"></video><div class="rs-media-error" hidden><strong>Preview unavailable</strong><p data-media-error>Refresh the source or use another browser-compatible file.</p></div><p class="rs-player-caption">Full source <span data-playhead>00:42.0</span><span class="rs-secondary">Synthetic playback sample</span></p></div>
                <section class="rs-manual" aria-label="Create manual segment"><div class="rs-manual-heading"><h4>Choose a segment</h4><span class="rs-badge">Manual · unscored</span></div><div class="rs-time-grid"><label>Start<input type="text" inputmode="decimal" value="00:42.0" data-start-time aria-label="Segment start timestamp"><button type="button" data-mark-start>Set start here</button></label><label>End<input type="text" inputmode="decimal" value="01:13.0" data-end-time aria-label="Segment end timestamp"><button type="button" data-mark-end>Set end here</button></label></div><div class="rs-save-row"><span class="rs-secondary" data-segment-duration>31.0 seconds</span><div class="rs-actions"><button type="button" data-preview>Preview interval</button><button class="rs-primary" type="button" data-save>Save manual segment</button></div></div><p class="rs-inline-message" data-segment-message role="status" aria-live="polite"></p></section>
                <details class="rs-transcript" open><summary>Full transcript <span class="rs-secondary">Source timeline</span></summary><div class="rs-transcript-copy"><p><time>00:00</time> The night keeps moving past the window. We leave the quiet streets behind.</p><p><time>00:42</time> There is a light beyond the station, a place we said that we would find.</p><p><time>01:13</time> Keep the last note ringing for a little longer. Let the silence hold the line.</p><p><time>02:18</time> We leave the quiet streets behind. There is a light beyond the station.</p></div></details>
              </div>
            </section>
          </div>
        </section>
        <section data-screen="review" hidden>
          <div class="rs-section-heading"><div><h2>Review</h2><p>Preview, adjust, and select segments for Clipper.</p></div><button type="button" class="rs-primary" data-handoff>Send selected to Clipper</button></div>
          <div class="rs-review-toolbar"><label>Show<select data-status-filter><option value="all">All</option><option value="candidate">Candidates</option><option value="selected">Selected</option><option value="reviewed">Reviewed</option><option value="rejected">Rejected</option></select></label><label>Source<select data-source-filter><option value="all">All sources</option><option value="0">Single release · official video</option><option value="1">Acoustic session</option></select></label><button type="button" data-check-duplicates>Check duplicates</button><details class="rs-duplicate-settings"><summary>Settings</summary><label>Duplicate similarity threshold<input type="number" value="0.65" min="0" max="1" step="0.01"></label></details></div>
          <p class="rs-inline-message" data-review-message role="status" aria-live="polite"></p>
          <div class="rs-review-group" data-manual-group><div class="rs-group-heading"><h3>Manual segments</h3><span class="rs-secondary">Unscored · your chosen intervals</span></div><div class="rs-review-grid" data-manual-cards></div></div>
          <div class="rs-review-group"><div class="rs-group-heading"><h3>Scored candidates</h3><span class="rs-secondary">Highest score first</span></div><div class="rs-review-grid" data-scored-cards></div></div>
          <p class="rs-review-empty" hidden>No segments match these filters.</p>
        </section>
        <section data-screen="profiles" hidden><div class="rs-section-heading"><div><h2>Profiles</h2><p>Saved profiles and their library counts.</p></div></div><div class="rs-profile-table"><div class="rs-profile-row rs-table-heading"><span>Profile</span><span>Sources</span><span>Candidates</span><span>Selected</span><span></span></div><div class="rs-profile-row"><div><strong>Music moments</strong><span class="rs-secondary">Version 2026-10-01</span></div><span>4</span><span>15</span><span>2</span><button type="button" data-open-profile="Music moments">Open review</button></div><div class="rs-profile-row"><div><strong>Interview moments</strong><span class="rs-secondary">Version 2026-10-01</span></div><span>2</span><span>11</span><span>1</span><button type="button" data-open-profile="Interview moments">Open review</button></div></div></section>
      </main>
      <p class="rs-notice" role="status" aria-live="polite"></p>
    </div>
  </template>
</div>
<style>

#rice-searcher-layouts .rs-transcript { border-top:1px solid var(--rs-line);margin-top:18px;padding-top:14px;font-size:13px; }
#rice-searcher-layouts .rs-transcript summary span { margin-left:8px; }
#rice-searcher-layouts .rs-transcript-copy p { margin-top:12px;line-height:1.6;font-size:13px; }
#rice-searcher-layouts .rs-transcript-copy time { display:block;color:var(--rs-muted);font-size:11px;font-variant-numeric:tabular-nums; }
#rice-searcher-layouts .rs-layout-detail .rs-workspace { display:block; }
#rice-searcher-layouts .rs-layout-detail.rs-source-visible .rs-library { display:none; }
#rice-searcher-layouts .rs-layout-detail .rs-inspector-navigation { display:flex; }
#rice-searcher-layouts .rs-layout-detail [data-close-inspector] { display:none; }
#rice-searcher-layouts .rs-layout-detail .rs-inspection-grid { display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.8fr);gap:18px;align-items:start; }
#rice-searcher-layouts .rs-layout-detail .rs-transcript { grid-column:2;grid-row:1/span 2;margin:0;border:1px solid var(--rs-line);border-radius:7px;background:var(--rs-mid);padding:15px; }
#rice-searcher-layouts .rs-layout-detail .rs-manual { grid-column:1; }
#rice-searcher-layouts .rs-layout-detail .rs-source-row { padding:15px; }
#rice-searcher-layouts .rs-layout-detail .rs-source-open-button { display:grid!important;grid-template-columns:1.3fr 1fr 1fr;gap:20px;align-items:center; }
#rice-searcher-layouts .rs-layout-drawer .rs-workspace { display:block;position:relative;min-height:930px; }
#rice-searcher-layouts .rs-layout-drawer .rs-source-row { padding:19px 15px; }
#rice-searcher-layouts .rs-layout-drawer .rs-source-open-button { max-width:30%; }
#rice-searcher-layouts .rs-layout-drawer .rs-inspector { position:absolute;top:0;right:0;width:66%;padding:18px;background:var(--rs-mid);border:1px solid var(--rs-control);border-radius:8px;box-shadow:-15px 0 24px #0008; }
#rice-searcher-layouts .rs-layout-drawer .rs-inspector-navigation { display:flex;justify-content:flex-end; }
#rice-searcher-layouts .rs-layout-drawer [data-back] { display:none; }
#rice-searcher-layouts .rs-layout-drawer .rs-bulk { justify-content:flex-start; }
#rice-searcher-layouts .rs-layout-drawer .rs-storage { max-width:32%; }
#rice-searcher-layouts .rs-review-toolbar { display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px; }
#rice-searcher-layouts .rs-review-toolbar label { font-size:12px; }
#rice-searcher-layouts .rs-review-toolbar [data-source-filter] { max-width:240px; }
#rice-searcher-layouts .rs-duplicate-settings { font-size:12px;position:relative; }
#rice-searcher-layouts .rs-duplicate-settings[open] label { position:absolute;top:30px;right:0;width:210px;background:var(--rs-in);padding:14px;border:1px solid var(--rs-control);border-radius:6px;z-index:4; }
#rice-searcher-layouts .rs-review-group { margin-bottom:24px; }
#rice-searcher-layouts .rs-group-heading { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rs-line); }
#rice-searcher-layouts .rs-review-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px; }
#rice-searcher-layouts .rs-review-card { border:1px solid var(--rs-line);border-radius:8px;background:var(--rs-mid);padding:14px; }
#rice-searcher-layouts .rs-review-card-content { display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:14px; }
#rice-searcher-layouts .rs-review-card video { width:100%;display:block;aspect-ratio:4/5;background:#000;border-radius:5px;object-fit:contain; }
#rice-searcher-layouts .rs-review-card-title { display:flex;gap:8px;align-items:start;margin-bottom:7px; }
#rice-searcher-layouts .rs-review-card-title strong { font-size:13px;font-weight:500; }
#rice-searcher-layouts .rs-score { font-size:19px;font-weight:600;line-height:1.2; }
#rice-searcher-layouts .rs-card-badges { display:flex;gap:5px;flex-wrap:wrap;margin:9px 0; }
#rice-searcher-layouts .rs-review-card p { font-size:12px;margin:8px 0;color:var(--rs-rice); }
#rice-searcher-layouts .rs-card-window { display:flex;gap:8px;font-size:12px;margin:12px 0; }
#rice-searcher-layouts .rs-card-window input { width:100%; }
#rice-searcher-layouts .rs-review-card .rs-actions { margin-top:14px;gap:6px; }
#rice-searcher-layouts .rs-review-card button { font-size:12px;padding-inline:9px; }
#rice-searcher-layouts .rs-profile-table { border:1px solid var(--rs-line);border-radius:8px;overflow:hidden; }
#rice-searcher-layouts .rs-profile-row { display:grid;grid-template-columns:1.6fr .65fr .7fr .65fr auto;gap:15px;align-items:center;padding:18px;border-bottom:1px solid var(--rs-line);background:var(--rs-mid); }
#rice-searcher-layouts .rs-profile-row:last-child { border-bottom:0; }
#rice-searcher-layouts .rs-profile-row .rs-secondary { display:block; }
#rice-searcher-layouts .rs-profile-row strong { font-weight:500; }
#rice-searcher-layouts .rs-table-heading { color:var(--rs-muted);font-size:12px;background:var(--rs-back); }
#rice-searcher-layouts .rs-empty-library { padding:30px 18px; }
#rice-searcher-layouts .rs-empty-library p { color:var(--rs-muted);margin:8px 0 18px; }
#rice-searcher-layouts .rs-notice:empty { display:none; }
#rice-searcher-layouts .rs-notice { margin:0 20px 20px!important;padding:12px;background:var(--rs-in);border:1px solid var(--rs-control);border-radius:6px;font-size:12px; }
#rice-searcher-layouts .rs-comfortable { --rs-pad:24px; }
@container rs (max-width:760px) {
  #rice-searcher-layouts .rs-app { min-height:1660px; }
  #rice-searcher-layouts .rs-topbar { gap:12px; }
  #rice-searcher-layouts .rs-brand { display:none; }
  #rice-searcher-layouts .rs-workspace { grid-template-columns:1fr; }
  #rice-searcher-layouts .rs-layout-drawer .rs-inspector { position:relative;width:100%;margin-top:18px;box-shadow:none; }
  #rice-searcher-layouts .rs-layout-drawer .rs-source-open-button,#rice-searcher-layouts .rs-layout-drawer .rs-storage { max-width:none; }
  #rice-searcher-layouts .rs-layout-detail .rs-inspection-grid { grid-template-columns:1fr; }
  #rice-searcher-layouts .rs-layout-detail .rs-transcript { grid-column:auto;grid-row:auto; }
  #rice-searcher-layouts .rs-layout-detail .rs-source-open-button { display:block!important; }
  #rice-searcher-layouts .rs-review-grid { grid-template-columns:1fr; }
  #rice-searcher-layouts .rs-intake-grid { grid-template-columns:1fr; }
}
@container rs (max-width:480px) {
  #rice-searcher-layouts .rs-suite { padding:0 12px;gap:12px; }
  #rice-searcher-layouts .rs-suite button { padding:6px 9px; }
  #rice-searcher-layouts .rs-local { display:none; }
  #rice-searcher-layouts .rs-topbar { padding:10px 12px;gap:10px; }

  #rice-searcher-layouts .rs-profile-label select { flex:1;max-width:230px; }
  #rice-searcher-layouts .rs-run { margin:12px 12px 0;padding:12px; }
  #rice-searcher-layouts .rs-content { padding:16px 12px; }
  #rice-searcher-layouts .rs-section-heading { align-items:start;gap:10px; }
  #rice-searcher-layouts .rs-section-heading>button { flex:none; }
  #rice-searcher-layouts .rs-section-heading p { max-width:200px; }
  #rice-searcher-layouts .rs-intake { padding:12px; }
  #rice-searcher-layouts .rs-intake-footer { flex-direction:column;align-items:start; }
  #rice-searcher-layouts .rs-settings { grid-template-columns:1fr; }
  #rice-searcher-layouts .rs-player-caption { flex-wrap:wrap; }
  #rice-searcher-layouts .rs-player-caption .rs-secondary { width:100%;margin:0; }
  #rice-searcher-layouts .rs-manual-heading { flex-wrap:wrap; }
  #rice-searcher-layouts .rs-save-row .rs-actions { width:100%; }
  #rice-searcher-layouts .rs-save-row button { flex:1; }
  #rice-searcher-layouts .rs-inspector-heading { align-items:start; }
  #rice-searcher-layouts .rs-run-details li { display:block; }
  #rice-searcher-layouts .rs-run-details li span { display:block;text-align:left!important; }
  #rice-searcher-layouts .rs-review-card-content { grid-template-columns:1fr; }
  #rice-searcher-layouts .rs-review-card video { aspect-ratio:16/9; }
  #rice-searcher-layouts .rs-group-heading { flex-direction:column;align-items:start;gap:4px; }
  #rice-searcher-layouts .rs-review-toolbar label { width:100%; }
  #rice-searcher-layouts .rs-review-toolbar select { max-width:100%;width:100%; }
  #rice-searcher-layouts .rs-profile-row { grid-template-columns:1fr 1fr;gap:10px; }
  #rice-searcher-layouts .rs-profile-row>div { grid-column:1/-1; }
  #rice-searcher-layouts .rs-profile-row>span:nth-child(2)::before { content:'Sources: ';color:var(--rs-muted); }
  #rice-searcher-layouts .rs-profile-row>span:nth-child(3)::before { content:'Candidates: ';color:var(--rs-muted); }
  #rice-searcher-layouts .rs-profile-row>span:nth-child(4)::before { content:'Selected: ';color:var(--rs-muted); }
  #rice-searcher-layouts .rs-table-heading { display:none; }
  #rice-searcher-layouts .rs-notice { margin-inline:12px!important; }
}
@media (pointer:coarse) { #rice-searcher-layouts .rs-app button,#rice-searcher-layouts .rs-app select,#rice-searcher-layouts .rs-app input:not([type=checkbox]) { min-height:44px; } #rice-searcher-layouts .rs-app input,#rice-searcher-layouts .rs-app textarea,#rice-searcher-layouts .rs-app select { font-size:16px; } }

    $('[data-clear-cache]').addEventListener('click',()=>{if(!clearArmed){clearArmed=true;$('[data-clear-cache]').textContent='Confirm purge everything';$('.rs-notice').textContent='This removes every source, transcript, and library segment. Click again to confirm.';return;}$$('.rs-source-row').forEach(n=>n.hidden=true);$('.rs-empty-library').hidden=false;$('.rs-inspector').hidden=true;app.classList.remove('rs-source-visible');$('.rs-source-count').textContent='0';state.manual=[];state.scored=[];clearArmed=false;$('[data-clear-cache]').textContent='Clear entire cache…';$('.rs-notice').textContent='Library and media cache cleared.';selection();renderReview();});
    function renderDesign() {
      app.classList.toggle('rs-comfortable',design.density==='Comfortable');state.batch=design.batch;updateRun();const available=design.media==='Ready';video.hidden=!available;$('.rs-media-error').hidden=available;$('[data-media-error]').textContent=design.media==='Missing media'?'The cached source file is missing. Add the source again to restore playback.':'This file cannot play in this browser. Use a browser-compatible source file.';$$('[data-mark-start],[data-mark-end],[data-preview]').forEach(n=>n.disabled=!available);
    }
    controllers.push(renderDesign);renderReview();renderDesign();
  }
  function renderAll() { controllers.forEach(render=>render()); }
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{renderAll();remember();}});tweak.addSelect(design,'density',{label:'Density',options:['Compact','Comfortable']});tweak.addSelect(design,'batch',{label:'Batch state',options:['Idle','Running','Finished with error','Stopped']});tweak.addSelect(design,'media',{label:'Playback state',options:['Ready','Missing media','Unsupported encoding']});}
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next){for(const key of ['density','batch','media'])if(typeof next[key]==='string')design[key]=next[key];renderAll();}});
})();
</script>
