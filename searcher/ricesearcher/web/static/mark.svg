<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RiceSearcher">
  <!-- Searcher: a magnifying glass examining a sprig of rice. White rice grains
       under a charcoal lens, mirroring the RiceClipper (shears + rice) and
       RicePoster (tray + rice) marks — same Slate palette, same flat two-tone. -->
  <g fill="#aeb3b6">
    <!-- rice stem -->
    <path d="M14.2 20.4c-.5-3.3-.2-6.4 1-9.4" fill="none" stroke="#aeb3b6"
          stroke-width="1.3" stroke-linecap="round"/>
    <!-- grain ears, paired up the stem toward the tip -->
    <ellipse cx="12.2" cy="16.1" rx="1.45" ry="2.4" transform="rotate(-34 12.2 16.1)"/>
    <ellipse cx="16.3" cy="15.2" rx="1.45" ry="2.4" transform="rotate(30 16.3 15.2)"/>
    <ellipse cx="12.9" cy="12.6" rx="1.45" ry="2.4" transform="rotate(-30 12.9 12.6)"/>
    <ellipse cx="16.7" cy="11.7" rx="1.45" ry="2.4" transform="rotate(26 16.7 11.7)"/>
    <ellipse cx="14.9" cy="8.8" rx="1.5" ry="2.7" transform="rotate(-5 14.9 8.8)"/>
  </g>
  <!-- magnifier lens framing the sprig -->
  <circle cx="14" cy="13" r="8.3" fill="none" stroke="#3b4044" stroke-width="2.4"/>
  <!-- handle -->
  <line x1="20.1" y1="19.1" x2="27.6" y2="26.6" stroke="#3b4044"
        stroke-width="3.4" stroke-linecap="round"/>
</svg>
