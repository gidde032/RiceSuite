<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiceSearcher — Review</title>
  <link rel="icon" href="/static/mark.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="mark"><img src="/static/mark.svg" alt="" width="26" height="26"></span>
    <h1 class="app-title">RiceSearcher <span>· Review</span></h1>
    <nav class="nav" aria-label="Primary">
      <a class="nav-link" href="/media">Media</a>
    </nav>
    <div class="filters" role="group" aria-label="Filter candidate slices by status">
      <label>Show
        <select id="statusFilter">
          <option value="candidate">Candidates</option>
          <option value="">All</option>
          <option value="selected">Selected</option>
          <option value="reviewed">Reviewed</option>
          <option value="rejected">Rejected</option>
        </select>
      </label>
      <span id="count" class="count" aria-live="polite"></span>
      <button id="handoffBtn" class="primary" type="button">Send selected → RiceClipper</button>
    </div>
  </header>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <main id="list" class="list"></main>
  <script src="/static/app.js"></script>
</body>
</html>
