name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: JS syntax check (review UI)
        run: |
          for f in ricesearcher/web/static/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: JS behavior tests (review UI)
        run: node --test tests/js/*.test.js
      - name: Tests + coverage floor
        run: pytest
